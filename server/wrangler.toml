# Taiao Phase-1 server — Cloudflare Worker + D1 + R2 + Turnstile.
# See server/README.md for first-deploy steps (create the D1 db + R2 bucket,
# paste their ids below, apply schema.sql, set secrets).

name = "taiao-server"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Canonical home: our-rpg.com. The zone route below makes the API same-origin
# for the game and Workshop served from that domain (no CORS in the primary
# path); the *.workers.dev URL keeps working for older builds until disabled
# in the dashboard (Settings → Domains & Routes) after the itch re-upload.
routes = [
  { pattern = "our-rpg.com/api/*", zone_name = "our-rpg.com" },
  # Community-zone page shells (src/zones.js pageShell): static files pass
  # through to Pages; 404s for live community zones get a synthesized shell
  # (zones/<zx>.<zy>.html and npc/<snake>/<shire>$<zx>.<zy>.html).
  { pattern = "our-rpg.com/workshop/zones/*", zone_name = "our-rpg.com" },
  { pattern = "our-rpg.com/workshop/npc/*", zone_name = "our-rpg.com" },
]

# Weekly workshop digest — Monday 09:00 UTC (Monday evening NZT) — plus the
# Phase-2 daily tick: rank recompute, envelope sweep, stale-stock sweep.
# Weekly workshop digest (Mon 09:00 UTC) + the Phase-2 daily tick (2:30 am NZT).
[triggers]
crons = ["0 9 * * 1", "30 14 * * *"]

# Phase 2: one Durable Object per world region holds the shared mutation
# ledger (node depletion, picked decor, station heat).
# Phase 3: one Durable Object per world ZONE relays real-time presence over
# hibernatable WebSockets (live.js).
[durable_objects]
bindings = [
  { name = "REGION", class_name = "RegionLedger" },
  { name = "LIVE", class_name = "LiveZone" },
  { name = "HUB", class_name = "GlobalHub" },
]

[[migrations]]
tag = "v2-region-ledger"
new_sqlite_classes = ["RegionLedger"]

[[migrations]]
tag = "v3-live-zone"
new_sqlite_classes = ["LiveZone"]

# Phase 4: one global Durable Object relays cross-zone presence — the online
# roster and direct messages (hub.js).
[[migrations]]
tag = "v4-global-hub"
new_sqlite_classes = ["GlobalHub"]

[[d1_databases]]
binding = "DB"
database_name = "taiao"
database_id = "4c8c84c1-d0c8-4822-beaf-5a105cb715e8"

[[r2_buckets]]
binding = "VAULT"
bucket_name = "taiao-vault"

[vars]
# Comma-separated origins allowed to call the API (no trailing slashes).
# our-rpg.com covers both the game (root) and the Workshop (/workshop) —
# same origin. html.itch.zone stays for the itch embed. passkeys.js derives
# its per-origin RP id from this same list.
ALLOWED_ORIGINS = "https://our-rpg.com,https://html.itch.zone,http://localhost:8899,http://127.0.0.1:8899"
# NPC dialogue engine (closed-source service; see ~/npc-engine/server/README.md).
# Empty = feature off: /api/npc/chat answers {reply:null,off:true} and clients
# fall back to the canned bank. Secret pair: `wrangler secret put NPC_ENGINE_KEY`.
NPC_ENGINE_URL = "https://npc.our-rpg.com"
# WebAuthn relying-party fallback id (used only when a request carries no
# Origin header; with one, rpIdFor() derives the RP id per-origin from the
# allowlist above — our-rpg.com passkeys and itch passkeys coexist).
RP_ID = "our-rpg.com"
# Live-presence moderation gates (live.js): the chat + player-trading
# protocols are fully built client AND server side, but refused until these
# are "on" — flip them (and redeploy) once moderation is staffed. No client
# rebuild needed; the server advertises the flags in the roster message.
LIVE_CHAT = "on"
LIVE_TRADE = "on"

# Secrets (set with `wrangler secret put NAME`), all optional:
#   TURNSTILE_SECRET  — enables Turnstile verification on register/login
#   ADMIN_TOKEN       — enables /api/admin/* (costs, flag queue, proposal status)
#   GITHUB_TOKEN      — with GITHUB_REPO, posts the weekly digest to Discussions
# Optional vars: GITHUB_REPO ("owner/name"), DIGEST_CATEGORY ("Workshop digest")
